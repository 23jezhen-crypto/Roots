<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rootbound</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #1c1c1c; color: #f5ecd3; font-family: Georgia, serif; }
    body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
    #game { width: min(100vw, 900px); height: min(100vh, 680px); display: block; cursor: crosshair; background: #4d4d4d; box-shadow: 0 18px 60px #080808; }
    .hint { position: fixed; bottom: 14px; font: 13px system-ui, sans-serif; color: #d9cfb5; opacity: .78; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game" width="900" height="680" tabindex="0" aria-label="Rootbound game"></canvas>
  <div class="hint">Move your mouse to grow • Collect water and minerals • Keep going down</div>
  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const mouse = { x: W / 2, y: H * .58 };
    const root = { x: W / 2, y: -7, radius: 9, speed: 4.2, angle: Math.PI / 2, trail: [] };
    const APPLE_SEED_DEPTH = 2000, PEAR_TREE_DEPTH = 5000, SAPLING_COST = 1, GROW_STAGE_COST = 25, FULL_GROWTH_STAGE = 4;
    const PEAR_GROWTH_STAGE_COST = 40, PEAR_FULL_GROWTH_STAGE = 4;
    const TREE_MATERIAL_COSTS = [5, 10, 15], UPGRADE_MINERAL_COSTS = [3, 5, 7], UPGRADE_WATER_COSTS = [3, 5, 7], MAX_UPGRADE_LEVEL = TREE_MATERIAL_COSTS.length;
    const TECH_TREES = {
      oak: {
        vitality: { title: 'DEEP ROOTS', detail: '+20 max health / level', amount: 20, color: '#c7784a' },
        water: { title: 'RAIN CATCHER', detail: '+5 water healing / level', amount: 5, color: '#63b9db' },
        poison: { title: 'THICK BARK', detail: '-1 poison damage / level', amount: 1, color: '#9d7848' }
      },
      apple: {
        vitality: { title: 'ORCHARD HEART', detail: '+15 max health / level', amount: 15, color: '#d85a51' },
        water: { title: 'SWEET SAP', detail: '+6 water healing / level', amount: 6, color: '#ef9b71' },
        poison: { title: 'ANTITOXIN FRUIT', detail: '-1 poison damage / level', amount: 1, color: '#97c75c' }
      },
      pear: {
        oil: { title: 'OIL BLOOM', detail: '+4 oil healing / level', amount: 4, color: '#d7aa54' },
        water: { title: 'DEEP RESERVES', detail: '+2 water healing / level', amount: 2, color: '#6eb5cb' },
        poison: { title: 'BITTER SKIN', detail: '-1 poison damage / level', amount: 1, color: '#9cb06a' }
      }
    };
    let cameraY = -220, depth = 0, water = 0, totalWater = 0, minerals = 0, totalMinerals = 0, treeLevel = 0, pearTreeLevel = 0, pulse = 0, health = 100, gameOver = false, started = false, paused = false, seedUnlocked = false, pearUnlocked = false, slowUntil = 0, boostUntil = 0, activeTree = 'oak', hoveredTree = null, pinnedTreeStats = null, showUpgradeMenu = false, selectedUpgradeTree = 'oak', lastRunScore = 0, lastGrowthEarned = 0, defenseCampaignWave = 1;
    const upgrades = { oak: { vitality: 0, water: 0, poison: 0 }, apple: { vitality: 0, water: 0, poison: 0 }, pear: { oil: 0, water: 0, poison: 0 } };
    const treeGrowth = { oak: 0, apple: 0, pear: 0 };
    const DEFENSE_COSTS = [3, 6, 9], MAX_DEFENSE_LEVEL = DEFENSE_COSTS.length;
    const defenseUpgrades = { firepower: 0, reload: 0, armor: 0 };
    const td = { active: false, wave: 0, toSpawn: 0, nextSpawn: 0, nextShot: 0, burstReady: 0, treeHealth: 0, enemies: [], shots: [], kills: 0, waveRewarded: false, waiting: false, techOpen: false, turretControlled: false };
    let items = [], stones = [], obstacles = [], particles = [];

    function rand(a, b) { return a + Math.random() * (b - a); }
    function worldY(y) { return y - cameraY; }
    function clamp(value, min = 0, max = 1) { return Math.max(min, Math.min(max, value)); }
    function blendColor(from, to, amount) {
      const start = from.match(/\w\w/g).map(hex => parseInt(hex, 16));
      const end = to.match(/\w\w/g).map(hex => parseInt(hex, 16));
      return 'rgb(' + start.map((value, index) => Math.round(value + (end[index] - value) * amount)).join(',') + ')';
    }
    function undergroundLightLevel() { return clamp(depth / 3000); }
    function undergroundColor() {
      const light = undergroundLightLevel();
      return light < .52 ? blendColor('684128', '484848', light / .52) : blendColor('484848', '060708', (light - .52) / .48);
    }
    function undergroundBottomColor() {
      const light = undergroundLightLevel();
      return light < .52 ? blendColor('352015', '1d1d1d', light / .52) : blendColor('1d1d1d', '030405', (light - .52) / .48);
    }
    function maxHealth(tree = activeTree) { return (tree === 'oak' ? 120 : 100) + (upgrades[tree].vitality || 0) * (TECH_TREES[tree].vitality?.amount || 0); }
    function waterHealing(tree = activeTree) { return (tree === 'pear' ? 6 : 12) + upgrades[tree].water * TECH_TREES[tree].water.amount; }
    function poisonDamage(tree = activeTree) { return Math.max(1, (tree === 'apple' ? 4 : tree === 'pear' ? 16 : 12) - upgrades[tree].poison * TECH_TREES[tree].poison.amount); }
    function oilHealing() { return 10 + upgrades.pear.oil * TECH_TREES.pear.oil.amount; }
    function oilSpeedMultiplier() { return 1.6 + upgrades.pear.oil * .1; }
    function treeGrowthName(tree = activeTree) { return tree === 'apple' ? 'apples' : tree === 'pear' ? 'pears' : 'acorns'; }
    function menuTreeAt(x, y) {
      if (x > W / 2 - 105 && x < W / 2 + 105 && y > H / 2 + 22 && y < H / 2 + 76) return 'oak';
      const appleCardBottom = H / 2 + (treeLevel >= FULL_GROWTH_STAGE ? 174 : 156);
      if (seedUnlocked && x > W / 2 - 142 && x < W / 2 + 142 && y > H / 2 + 90 && y < appleCardBottom) return 'apple';
      if (pearUnlocked && x > W / 2 - 142 && x < W / 2 + 142 && y > H / 2 + 184 && y < H / 2 + 244) return 'pear';
      return null;
    }
    function upgradeAt(x, y) {
      if (y < 292 || y > 462) return null;
      const keys = Object.keys(TECH_TREES[selectedUpgradeTree]);
      const index = Math.floor((x - 115) / 235);
      return index >= 0 && index < keys.length && x < 315 + index * 235 ? keys[index] : null;
    }
    function addChunk(fromY) {
      for (let i = 0; i < 6; i++) {
        let resource;
        for (let attempt = 0; attempt < 24; attempt++) {
          const roll = Math.random();
          const type = roll < .43 ? 'water' : roll < .55 ? 'poison' : roll < .67 ? 'oil' : 'mineral';
          const candidate = { x: rand(42, W - 42), y: fromY + rand(30, 510), type, r: type === 'mineral' ? rand(7, 11) : rand(30, 44), taken: false, wobble: rand(0, 6.28), harvestAt: 0, shape: Math.floor(rand(0, 4)), tunnels: [] };
          const overlapsResource = items.some(item => Math.hypot(candidate.x - item.x, candidate.y - item.y) < candidate.r + item.r + 20);
          if (!overlapsResource) { resource = candidate; break; }
        }
        if (resource) items.push(resource);
      }
      for (let i = 0; i < 20; i++) stones.push({ x: rand(0, W), y: fromY + rand(0, 520), r: rand(14, 40), shade: rand(0, 1) });
      // The first 50 m is clear soil; obstacles appear only deeper underground.
      if (fromY >= 50) {
        // Hazards steadily thicken with depth, while a generous collision margin keeps them separate.
        const obstacleCount = Math.min(9, 2 + Math.floor(fromY / 900));
        for (let i = 0; i < obstacleCount; i++) {
          for (let attempt = 0; attempt < 18; attempt++) {
            const y = fromY + rand(70, 470);
            let candidate;
            if (Math.random() < .55) {
              const left = Math.random() < .5;
              candidate = { type: 'wall', x: left ? 0 : rand(W * .58, W * .78), y, w: left ? rand(W * .22, W * .4) : rand(W * .16, W * .28), h: rand(65, 140) };
            } else {
              candidate = { type: 'tunnel', x: rand(110, W - 110), y, r: rand(24, 38), length: rand(130, 210), opening: 16, angle: (Math.random() < .5 ? -1 : 1) * rand(.22, .55) };
            }
            if (!overlapsObstacle(candidate)) { obstacles.push(candidate); break; }
          }
        }
      }
    }
    function obstacleBounds(o) {
      if (o.type === 'wall') return { left: o.x, right: o.x + o.w, top: o.y, bottom: o.y + o.h };
      const xReach = Math.abs(Math.cos(o.angle)) * o.length / 2 + o.r;
      const yReach = Math.abs(Math.sin(o.angle)) * o.length / 2 + o.r;
      return { left: o.x - xReach, right: o.x + xReach, top: o.y - yReach, bottom: o.y + yReach };
    }
    function overlapsObstacle(candidate) {
      const a = obstacleBounds(candidate), gap = 20;
      return obstacles.some(o => {
        const b = obstacleBounds(o);
        return a.left - gap < b.right && a.right + gap > b.left && a.top - gap < b.bottom && a.bottom + gap > b.top;
      });
    }
    function resetWorld() {
      cameraY = -220; depth = 0; water = 0; minerals = 0; health = maxHealth(); slowUntil = 0; boostUntil = 0; paused = false;
      root.x = W / 2; root.y = -7; root.angle = Math.PI / 2; root.trail = [];
      items = []; stones = []; obstacles = []; particles = [];
      for (let y = 30; y < 2600; y += 500) addChunk(y);
    }
    function returnToTreeAfterDeath() {
      lastRunScore = depth;
      lastGrowthEarned = Math.max(1, Math.floor(lastRunScore / 100));
      treeGrowth[activeTree] = Math.min(30, treeGrowth[activeTree] + lastGrowthEarned);
      resetWorld(); startTowerDefense();
    }
    function startTowerDefense() {
      const now = performance.now();
      td.active = true; td.wave = defenseCampaignWave; td.toSpawn = 3 + td.wave; td.nextSpawn = now + 600; td.nextShot = now;
      td.burstReady = now; td.treeHealth = maxHealth() + defenseUpgrades.armor * 20; td.enemies = []; td.shots = []; td.kills = 0; td.waveRewarded = false; td.waiting = false; td.techOpen = false; td.turretControlled = false;
      gameOver = false; started = false;
    }
    function endTowerDefense() {
      td.active = false; defenseCampaignWave = 1; gameOver = true; started = false;
    }
    function spawnDefenseEnemy() {
      const fromLeft = Math.random() < .5;
      td.enemies.push({ x: fromLeft ? -25 : W + 25, y: rand(320, 480), side: fromLeft ? 1 : -1, hp: 22 + td.wave * 7, speed: .42 + td.wave * .045, r: 13 + Math.min(7, td.wave), hit: 0 });
    }
    function fireTreeShot(target) {
      const colors = activeTree === 'apple' ? '#e55346' : activeTree === 'pear' ? '#d9d755' : '#aa7045';
      td.shots.push({ x: W / 2 + 92, y: 445, target, color: colors, damage: (activeTree === 'pear' ? 19 : activeTree === 'apple' ? 17 : 16) + defenseUpgrades.firepower * 5 });
    }
    function updateTowerDefense() {
      const now = performance.now();
      if (td.waiting || td.techOpen) return;
      if (td.toSpawn > 0 && now >= td.nextSpawn) { spawnDefenseEnemy(); td.toSpawn--; td.nextSpawn = now + Math.max(260, 760 - td.wave * 35); }
      const target = td.enemies.reduce((nearest, enemy) => !nearest || Math.abs(enemy.x - W / 2) < Math.abs(nearest.x - W / 2) ? enemy : nearest, null);
      if (!td.turretControlled && target && now >= td.nextShot) { fireTreeShot(target); td.nextShot = now + Math.max(220, 720 - upgrades[activeTree].water * 55 - defenseUpgrades.reload * 75); }
      for (const enemy of td.enemies) {
        enemy.x += enemy.side * enemy.speed;
        enemy.y += Math.sin(now / 400 + enemy.x * .02) * .14;
        if (Math.abs(enemy.x - W / 2) < 35) { td.treeHealth = Math.max(0, td.treeHealth - 9); enemy.hp = 0; }
      }
      for (const shot of td.shots) {
        if (!shot.target || shot.target.hp <= 0) { shot.life = 0; continue; }
        const dx = shot.target.x - shot.x, dy = shot.target.y - shot.y, distance = Math.hypot(dx, dy) || 1;
        const step = Math.min(12, distance); shot.x += dx / distance * step; shot.y += dy / distance * step;
        if (distance < 15) { shot.target.hp -= shot.damage; shot.target.hit = now; shot.life = 0; }
      }
      const before = td.enemies.length;
      td.enemies = td.enemies.filter(enemy => enemy.hp > 0);
      td.kills += before - td.enemies.length;
      td.shots = td.shots.filter(shot => shot.life !== 0);
      if (td.treeHealth <= 0) { endTowerDefense(); return; }
      if (td.toSpawn === 0 && td.enemies.length === 0) {
        if (!td.waveRewarded) { treeGrowth[activeTree] = Math.min(30, treeGrowth[activeTree] + td.wave); td.waveRewarded = true; td.waiting = true; }
      }
    }
    function triggerDefenseBurst() {
      const now = performance.now();
      if (now < td.burstReady) return;
      td.burstReady = now + 5000;
      td.enemies.forEach(enemy => { if (Math.abs(enemy.x - W / 2) < 260) { enemy.hp -= 24; enemy.hit = now; } });
    }
    function descendFromDefense() {
      defenseCampaignWave = td.wave + 1; td.active = false; td.waiting = false; td.techOpen = false; started = true; gameOver = false;
      health = maxHealth(); root.x = W / 2; root.y = -7; root.trail = []; cameraY = -220;
    }
    function startNextDefenseWave() {
      td.wave++; defenseCampaignWave = td.wave; td.toSpawn = 3 + td.wave * 2; td.nextSpawn = performance.now() + 650; td.waveRewarded = false; td.waiting = false;
    }
    function handleDefenseClick(x, y) {
      if (td.techOpen) {
        if (x > W / 2 - 95 && x < W / 2 + 95 && y > 500 && y < 550) { td.techOpen = false; return; }
        const keys = ['firepower', 'reload', 'armor'];
        const index = Math.floor((x - 115) / 235), key = keys[index];
        if (key && x < 315 + index * 235 && y > 270 && y < 450 && defenseUpgrades[key] < MAX_DEFENSE_LEVEL) {
          const level = defenseUpgrades[key], materialCost = DEFENSE_COSTS[level], mineralCost = UPGRADE_MINERAL_COSTS[level], waterCost = UPGRADE_WATER_COSTS[level];
          if (treeGrowth[activeTree] >= materialCost && totalMinerals >= mineralCost && totalWater >= waterCost) {
            treeGrowth[activeTree] -= materialCost; totalMinerals -= mineralCost; totalWater -= waterCost; defenseUpgrades[key]++;
            if (key === 'armor') td.treeHealth += 20;
          }
        }
        return;
      }
      if (td.waiting) {
        if (x > 80 && x < 320 && y > 565 && y < 620) { descendFromDefense(); return; }
        if (x > 340 && x < 560 && y > 565 && y < 620) { startNextDefenseWave(); return; }
        if (x > 580 && x < 820 && y > 565 && y < 620) { td.techOpen = true; return; }
        return;
      }
      if (x > W / 2 + 60 && x < W / 2 + 125 && y > 408 && y < 472) { td.turretControlled = !td.turretControlled; return; }
      if (td.turretControlled) {
        const target = td.enemies.reduce((nearest, enemy) => !nearest || Math.hypot(enemy.x - x, enemy.y - y) < Math.hypot(nearest.x - x, nearest.y - y) ? enemy : nearest, null);
        if (target && performance.now() >= td.nextShot) { fireTreeShot(target); td.nextShot = performance.now() + Math.max(150, 420 - defenseUpgrades.reload * 65); }
      } else triggerDefenseBurst();
    }
    resetWorld();

    canvas.addEventListener('pointermove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) * W / r.width;
      mouse.y = (e.clientY - r.top) * H / r.height;
      hoveredTree = !started && !showUpgradeMenu ? menuTreeAt(mouse.x, mouse.y) : null;
    });
    canvas.addEventListener('pointerleave', () => { hoveredTree = null; });
    canvas.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (showUpgradeMenu) return;
      const r = canvas.getBoundingClientRect();
      const tree = menuTreeAt((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
      if (tree) pinnedTreeStats = tree;
    });
    canvas.addEventListener('pointerdown', e => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
      if (e.button !== 0) return;
      if (td.active) { handleDefenseClick(x, y); canvas.focus(); return; }
      pinnedTreeStats = null;
      if (started && x > W - 110 && x < W - 20 && y > 16 && y < 48) { paused = !paused; canvas.focus(); return; }
      if (paused) {
        if (x > W / 2 - 105 && x < W / 2 + 105 && y > H / 2 - 4 && y < H / 2 + 46) { paused = false; }
        else if (x > W / 2 - 105 && x < W / 2 + 105 && y > H / 2 + 58 && y < H / 2 + 108) { resetWorld(); started = true; }
        canvas.focus(); return;
      }
      if (!started && showUpgradeMenu) {
        if (x > W / 2 - 95 && x < W / 2 + 95 && y > 500 && y < 550) { showUpgradeMenu = false; canvas.focus(); return; }
        if (y > 170 && y < 208) {
          if (x > 130 && x < 330) selectedUpgradeTree = 'oak';
          else if (x > 350 && x < 550 && treeLevel >= FULL_GROWTH_STAGE) selectedUpgradeTree = 'apple';
          else if (x > 570 && x < 770 && pearTreeLevel >= PEAR_FULL_GROWTH_STAGE) selectedUpgradeTree = 'pear';
          canvas.focus(); return;
        }
        const upgrade = upgradeAt(x, y);
        const treeUpgrades = upgrades[selectedUpgradeTree];
        if (upgrade && treeUpgrades[upgrade] < MAX_UPGRADE_LEVEL) {
          const materialCost = TREE_MATERIAL_COSTS[treeUpgrades[upgrade]];
          const mineralCost = UPGRADE_MINERAL_COSTS[treeUpgrades[upgrade]];
          const waterCost = UPGRADE_WATER_COSTS[treeUpgrades[upgrade]];
          if (treeGrowth[selectedUpgradeTree] >= materialCost && totalMinerals >= mineralCost && totalWater >= waterCost) {
            treeGrowth[selectedUpgradeTree] -= materialCost; totalMinerals -= mineralCost; totalWater -= waterCost; treeUpgrades[upgrade]++;
            if (upgrade === 'vitality' && selectedUpgradeTree === activeTree) health = Math.min(maxHealth(), health + TECH_TREES[selectedUpgradeTree].vitality.amount);
          }
        }
        canvas.focus(); return;
      }
      if (!started && x > W / 2 - 125 && x < W / 2 + 125 && y > H / 2 + 260 && y < H / 2 + 310) {
        showUpgradeMenu = true; canvas.focus(); return;
      }
      const appleTreeReady = treeLevel >= FULL_GROWTH_STAGE;
      if (!started && appleTreeReady && x > W / 2 - 140 && x < W / 2 + 140 && y > H / 2 + 92 && y < H / 2 + 172) {
        activeTree = 'apple'; health = maxHealth(); gameOver = false; started = true; canvas.focus(); return;
      }
      const growthCost = treeLevel === 0 ? SAPLING_COST : GROW_STAGE_COST;
      if (!started && seedUnlocked && !appleTreeReady && x > W / 2 - 140 && x < W / 2 + 140 && y > H / 2 + 92 && y < H / 2 + 156 && totalMinerals >= growthCost) {
        totalMinerals -= growthCost; treeLevel++; canvas.focus(); return;
      }
      if (!started && pearUnlocked && pearTreeLevel >= PEAR_FULL_GROWTH_STAGE && x > W / 2 - 142 && x < W / 2 + 142 && y > H / 2 + 184 && y < H / 2 + 244) {
        activeTree = 'pear'; health = maxHealth(); gameOver = false; started = true; canvas.focus(); return;
      }
      if (!started && pearUnlocked && pearTreeLevel < PEAR_FULL_GROWTH_STAGE && x > W / 2 - 142 && x < W / 2 + 142 && y > H / 2 + 184 && y < H / 2 + 244 && totalMinerals >= PEAR_GROWTH_STAGE_COST) {
        totalMinerals -= PEAR_GROWTH_STAGE_COST; pearTreeLevel++; canvas.focus(); return;
      }
      if (!started && x > W / 2 - 105 && x < W / 2 + 105 && y > H / 2 + 22 && y < H / 2 + 76) {
        activeTree = 'oak'; health = maxHealth(); gameOver = false; started = true;
      }
      canvas.focus();
    });
    window.addEventListener('keydown', e => {
      if ((e.key === 'Escape' || e.key.toLowerCase() === 'p') && started) { paused = !paused; e.preventDefault(); }
    });

    function hitsObstacle(x, y) {
      return obstacles.some(o => {
        if (o.type === 'tunnel') {
          const cos = Math.cos(o.angle), sin = Math.sin(o.angle);
          const along = (x - o.x) * cos + (y - o.y) * sin;
          const across = -(x - o.x) * sin + (y - o.y) * cos;
          const insidePipe = Math.abs(along) < o.length / 2 + root.radius && Math.abs(across) < o.r + root.radius;
          // The clear channel follows the pipe's long, slanted axis.
          return insidePipe && Math.abs(across) > o.opening + root.radius;
        }
        if (o.type === 'wall') return x + root.radius > o.x && x - root.radius < o.x + o.w && y + root.radius > o.y && y - root.radius < o.y + o.h;
        const nearX = Math.max(o.x - o.length / 2, Math.min(x, o.x + o.length / 2));
        return Math.hypot(x - nearX, y - o.y) < root.radius + o.r;
      });
    }

    function update() {
      if (td.active) { updateTowerDefense(); return; }
      if (!started || paused) return;
      pulse += .035;
      // The root always grows down; mouse controls its underground path.
      const targetX = mouse.x;
      const targetY = Math.max(root.y + 55, cameraY + mouse.y);
      const dx = targetX - root.x, dy = targetY - root.y;
      const d = Math.hypot(dx, dy) || 1;
      root.angle = Math.atan2(dy, dx);
      const oldX = root.x, oldY = root.y;
      const movementMultiplier = performance.now() < slowUntil ? .42 : performance.now() < boostUntil ? oilSpeedMultiplier() : 1;
      const step = Math.min(root.speed * movementMultiplier, d);
      // Resolve each axis separately so a wall stops digging downward, but never traps sideways movement.
      const nextX = Math.max(root.radius, Math.min(W - root.radius, oldX + dx / d * step));
      if (!hitsObstacle(nextX, oldY)) root.x = nextX;
      const nextY = oldY + dy / d * step;
      if (!hitsObstacle(root.x, nextY)) root.y = nextY;
      root.trail.push({ x: root.x, y: root.y });
      if (root.y > cameraY + H * .58) cameraY += (root.y - (cameraY + H * .58)) * .04;
      depth = Math.max(depth, Math.floor(Math.max(0, root.y) * .10));
      if (depth >= APPLE_SEED_DEPTH) seedUnlocked = true;
      if (depth >= PEAR_TREE_DEPTH) pearUnlocked = true;
      health = Math.max(0, health - .04 - Math.max(0, root.y - oldY) * .028);
      if (health <= 0) { returnToTreeAfterDeath(); return; }
      while (cameraY + H + 900 > stones[stones.length - 1].y) addChunk(stones[stones.length - 1].y + 20);

      for (const item of items) {
        if (item.taken) continue;
        if (Math.hypot(root.x - item.x, root.y - item.y) < root.radius + item.r + 4 && performance.now() - item.harvestAt > 220) {
          item.harvestAt = performance.now();
          if (item.type === 'water' || item.type === 'poison' || item.type === 'oil') {
            const lastTunnel = item.tunnels[item.tunnels.length - 1];
            if (!lastTunnel || Math.hypot(root.x - lastTunnel.x, root.y - lastTunnel.y) > root.radius * 1.45) {
              item.tunnels.push({ x: root.x, y: root.y });
              if (item.type === 'water') { water++; totalWater++; health = Math.min(maxHealth(), health + waterHealing()); }
              else if (item.type === 'oil' && activeTree === 'pear') {
